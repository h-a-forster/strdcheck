[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "strdcheck"
version = "0.1.0"
description = "Numerical accuracy of the Python data stack on the NIST Statistical Reference Datasets: log relative error (LRE) for numpy, pandas, polars, DuckDB, statsmodels, scipy and PyTorch, a pytest plugin, and a published LRE table."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "strdcheck contributors" }]
keywords = [
    "numerical-accuracy", "nist", "strd", "statistical-software", "regression",
    "nonlinear-least-squares", "floating-point", "pytest-plugin", "benchmark", "validation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
# The core (dataset manifest, fetch, parser, LRE, pytest plugin) needs numpy only.
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
# Engines measured by the study. Each adapter imports its engine lazily.
engines = [
    "scipy>=1.13",
    "pandas>=2.2",
    "polars>=1.0",
    "duckdb>=1.1",
    "statsmodels>=0.14.2",
    "threadpoolctl>=3.1",
    "mpmath>=1.3",
]
# CPU-only PyTorch wheels come from the PyTorch CPU index (see [tool.uv.sources]).
torch = ["torch>=2.5"]

[project.urls]
Homepage = "https://github.com/h-a-forster/strdcheck"
Documentation = "https://github.com/h-a-forster/strdcheck/tree/main/docs"
Issues = "https://github.com/h-a-forster/strdcheck/issues"
Changelog = "https://github.com/h-a-forster/strdcheck/blob/main/CHANGELOG.md"

[project.scripts]
strdcheck = "strdcheck.cli:main"

[project.entry-points.pytest11]
strdcheck = "strdcheck.pytest_plugin"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mpmath>=1.3",
    "scipy>=1.13",
    "pandas>=2.2",
    "polars>=1.0",
    "duckdb>=1.1",
    "statsmodels>=0.14.2",
    "threadpoolctl>=3.1",
]

# Torch is resolved from the CPU index on every platform; it is installed only with
# `uv sync --extra torch`.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/strdcheck"]

[tool.hatch.build.targets.sdist]
include = [
    "src/strdcheck", "tests", "docs", "scripts", "README.md", "LICENSE", "CHANGELOG.md",
    "CONTRIBUTING.md", "SECURITY.md", "CITATION.cff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
